[package]
name = "gpgpu-tool"
version = "0.3.0"
description = "GPU 加速算法库，基于 wgpu。GPU 优先，CPU 降级。提供感知哈希（6种算法）、SHA-256、PDQ 哈希、GPU 汉明距离匹配、BK-tree 近似搜索等开箱即用的 GPU 计算能力。"
edition = "2021"
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/solo-king/wgpu-tool"
keywords = ["gpu", "compute", "wgpu", "parallel", "hashing", "perceptual-hash", "image-similarity"]
categories = ["science::gpu", "algorithms::data-processing", "multimedia::images"]

[dependencies]
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
thiserror = "2"
log = "0.4"
smallvec = "1"
image = { version = "0.25", optional = true }

sha2 = { version = "0.10", optional = true }
rayon = { version = "1.10", optional = true }

[features]
default = []
cpu-fallback = ["dep:sha2"]
parallel-cpu = ["cpu-fallback", "dep:rayon"]
dual-encoder = []
pdq = []
image = ["dep:image"]

# GPU 加速集成入口 feature，聚合图像处理依赖。
# wgpu 为核心依赖（始终包含），此 feature 额外启用 image crate 集成。
gpu-accel = ["image"]

# czkawka 兼容层入口，依赖 gpu-accel。
czkawka-compat = ["gpu-accel"]

[dev-dependencies]
rand = "0.9"
criterion = { version = "0.5", features = ["html_reports"] }
env_logger = "0.11"
hex = "0.4"
chrono = "0.4"
image = "0.25"
img_hash = "3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "similar_images"
path = "examples/similar_images.rs"
required-features = ["czkawka-compat"]

[package.metadata.docs.rs]
features = ["image"]

[[bench]]
name = "sha256_bench"
path = "benches/sha256_bench.rs"
harness = false

