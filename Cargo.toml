[package]
name = "wgpu-compute-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
thiserror = "2"
log = "0.4"

[dev-dependencies]
sha2 = "0.10"
rand = "0.9"
criterion = { version = "0.5", features = ["html_reports"] }
env_logger = "0.11"
hex = "0.4"
chrono = "0.4"

[[bench]]
name = "sha256_bench"
path = "benches/sha256_bench.rs"
harness = false
