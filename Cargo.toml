[package]
name = "wgpu-compute-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
thiserror = "2"
log = "0.4"
image = { version = "0.25", optional = true }

[features]
default = []
image = ["dep:image"]

[dev-dependencies]
sha2 = "0.10"
rand = "0.9"
criterion = { version = "0.5", features = ["html_reports"] }
env_logger = "0.11"
hex = "0.4"
chrono = "0.4"
image = "0.25"

[[bench]]
name = "sha256_bench"
path = "benches/sha256_bench.rs"
harness = false

[[bench]]
name = "mean_hash_bench"
path = "benches/mean_hash_bench.rs"
harness = false

[[bench]]
name = "gradient_hash_bench"
path = "benches/gradient_hash_bench.rs"
harness = false

[[bench]]
name = "block_hash_bench"
path = "benches/block_hash_bench.rs"
harness = false

[[bench]]
name = "vert_gradient_hash_bench"
path = "benches/vert_gradient_hash_bench.rs"
harness = false

[[bench]]
name = "double_gradient_hash_bench"
path = "benches/double_gradient_hash_bench.rs"
harness = false

[[bench]]
name = "median_hash_bench"
path = "benches/median_hash_bench.rs"
harness = false

[[bench]]
name = "bktree_bench"
path = "benches/bktree_bench.rs"
harness = false

[[bench]]
name = "gpu_utilization_bench"
path = "benches/gpu_utilization_bench.rs"
harness = false

[[bench]]
name = "real_image_bench"
path = "benches/real_image_bench.rs"
harness = false

[[bench]]
name = "gpu_stress_bench"
path = "benches/gpu_stress_bench.rs"
harness = false

[[bench]]
name = "large_scale_bench"
path = "benches/large_scale_bench.rs"
harness = false
